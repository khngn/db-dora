name: dora
services:
  dora-postgres:
    image: postgres:14.20
    container_name: dora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dora
      POSTGRES_USER: dora
      POSTGRES_PASSWORD: dora
    ports:
      - "5432:5432"
    volumes:
      - dora-postgres-data:/var/lib/postgresql/data
      - './docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dora -d dora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dora-postgres-data: